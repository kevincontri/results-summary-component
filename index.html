<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="result">
        <h2>Your Result</h2>
        <div id="your-score">
          <p>76</p>
          <p>of 100</p>
        </div>

        <h1>Great</h1>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>

      <div class="summary">
        <h2>Summary</h2>

        <div class="reaction">
          <img src="./assets/icon-reaction.svg" alt="Reaction Icon" />
          <p>Reaction</p>
          <p><span>80</span> / 100</p>
        </div>

        <div class="memory">
          <img src="./assets/icon-memory.svg" alt="Memory Icon" />
          <p>Memory</p>
          <p><span>92</span> / 100</p>
        </div>

        <div class="verbal">
          <img src="./assets/icon-verbal.svg" alt="Verbal Icon" />
          <p>Verbal</p>
          <p><span>61</span> / 100</p>
        </div>

        <div class="visual">
          <img src="./assets/icon-visual.svg" alt="Visual Icon" />
          <p>Visual</p>
          <p><span>72</span> / 100</p>
        </div>

        <a href="#">Continue</a>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/kevincontri">Kevin Contri</a>.
    </footer>
  </body>
</html>
